
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Profile | CSC584</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- PAGE HEADER -->
        <div class="page-header">

            <h1>Create Your Personal Profile</h1>

            <p>
                Please fill in your personal information
                below to create your profile.
            </p>

        </div>

        <!-- PERSONAL INFORMATION CARD -->
        <div class="card">

            <h2>Personal Information</h2>

            <!-- HTML FORM -->
            <form action="ProfileServlet" method="post">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           maxlength="120"
                           required>

                </div>

                <!-- STUDENT ID AND PROGRAMME -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input type="text"
                               id="studentId"
                               name="studentId"
                               placeholder="Enter your student ID"
                               maxlength="30"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="programme">
                            Programme
                        </label>

                        <input type="text"
                               id="programme"
                               name="programme"
                               placeholder="Enter your programme"
                               maxlength="120"
                               required>

                    </div>

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@student.uitm.edu.my"
                           maxlength="190"
                           required>

                </div>

                <!-- HOBBIES -->
                <div class="form-group">

                    <label for="hobbies">
                        Hobbies
                    </label>

                    <input type="text"
                           id="hobbies"
                           name="hobbies"
                           placeholder="e.g. Gaming, Coding, Reading"
                           maxlength="250"
                           required>

                </div>

                <!-- SELF INTRODUCTION -->
                <div class="form-group">

                    <label for="introduction">
                        Short Self-Introduction
                    </label>

                    <textarea id="introduction"
                              name="introduction"
                              rows="5"
                              maxlength="1000"
                              placeholder="Tell us a little about yourself..."
                              required></textarea>

                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="btn">
                    Submit Profile
                </button>

            </form>

        </div>

        <!-- FOOTER -->
        <footer>
            CSC584 - Individual Assignment 1
            <p>Personal Profile Web Application</p>
        </footer>

    </div>

</body>
</html>
